<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" fill="#94a3b8" viewBox="0 0 760 670" width="100%" xmlns="http://www.w3.org/2000/svg">
  <!-- Arrows, section labels and legend use mid grey (#94a3b8) so they read on light and dark backgrounds. -->
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <!-- main column -->
    <path d="M380 63 v30 m-4 -5 l4 5 4 -5"/>
    <path d="M380 156 v15 m-4 -5 l4 5 4 -5"/>
    <path d="M380 234 v31 m-4 -5 l4 5 4 -5"/>
    <path d="M380 404 v15 m-4 -5 l4 5 4 -5"/>
    <path d="M380 546 v15 m-4 -5 l4 5 4 -5"/>
    <!-- side arrows -->
    <path d="M530 125 h19 m-5 -4 l5 4 -5 4"/>
    <path d="M210 203 h19 m-5 -4 l5 4 -5 4"/>
    <path d="M530 203 h19 m-5 -4 l5 4 -5 4"/>
    <path d="M530 287 h19 m-5 -4 l5 4 -5 4"/>
    <path d="M530 335 h19 m-5 -4 l5 4 -5 4"/>
    <path d="M530 383 h19 m-5 -4 l5 4 -5 4"/>
    <path d="M530 483 h19 m-5 -4 l5 4 -5 4"/>
  </g>

  <!-- Entry point -->
  <rect x="230" y="10" width="300" height="53" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="244" y="31" font-size="12" font-weight="600" fill="#17253c">manage.py import_readings</text>
  <text x="244" y="48" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">data/*.csv [--dry-run]</text>

  <!-- ===== Pass 1 ===== -->
  <text x="10" y="121" font-size="9.5" font-weight="600" letter-spacing="0.8">PASS 1 · CHECK EVERY FILE</text>
  <text x="10" y="135" font-size="9.5" font-weight="600" letter-spacing="0.8">AND STORE NOTHING</text>

  <rect x="230" y="94" width="300" height="62" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="244" y="114" font-size="12" font-weight="600" fill="#17253c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">check_header()</text>
  <text x="244" y="130" font-size="10" fill="#475569">year, Zone Substation, Date, Unit, and all</text>
  <text x="244" y="145" font-size="10" fill="#475569">96 labels, looked up by name (h:00 is out of order)</text>

  <rect x="550" y="94" width="200" height="62" rx="9" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="562" y="114" font-size="12" font-weight="600" fill="#7f1d1d">Stop</text>
  <text x="562" y="130" font-size="10" fill="#991b1b">Missing column or a file</text>
  <text x="562" y="145" font-size="10" fill="#991b1b">that can't be read</text>

  <rect x="230" y="172" width="300" height="62" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="244" y="192" font-size="12" font-weight="600" fill="#17253c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">resolve_meters()</text>
  <text x="244" y="208" font-size="10" fill="#475569">Every Zone Substation in every file →</text>
  <text x="244" y="223" font-size="10" fill="#475569">Meter.identifier, which must be 15-minute</text>

  <rect x="10" y="172" width="200" height="62" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="22" y="192" font-size="12" font-weight="600" fill="#17253c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">seed_substations</text>
  <text x="22" y="208" font-size="10" fill="#475569">Run once: 6 meters, 15 min;</text>
  <text x="22" y="223" font-size="10" fill="#475569">Croudace Bay records export</text>

  <rect x="550" y="172" width="200" height="62" rx="9" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="562" y="192" font-size="12" font-weight="600" fill="#7f1d1d">Stop, nothing imported</text>
  <text x="562" y="208" font-size="10" fill="#991b1b">Unknown substation, or a</text>
  <text x="562" y="223" font-size="10" fill="#991b1b">meter that isn't 15-minute</text>

  <!-- ===== Pass 2 ===== -->
  <text x="10" y="254" font-size="9.5" font-weight="600" letter-spacing="0.8">PASS 2 · EACH FILE IN TURN</text>

  <!-- Adapter -->
  <rect x="230" y="266" width="300" height="138" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="244" y="286" font-size="12" font-weight="600" fill="#17253c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">iter_submissions()</text>
  <text x="244" y="304" font-size="10" fill="#475569">Streams each day × 96 labels:</text>
  <text x="244" y="319" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">period_end_utc(day, label)</text>
  <text x="244" y="334" font-size="10" fill="#475569">  Date + label in Australia/Sydney → UTC</text>
  <text x="244" y="349" font-size="10" fill="#475569">  (24:00 is the next day's 00:00)</text>
  <text x="244" y="364" font-size="10" fill="#475569">start = end − 15 min</text>
  <text x="244" y="379" font-size="10" fill="#475569">Yields a ReadingSubmission, value kept as text</text>
  <text x="244" y="394" font-size="10" fill="#475569">(6 dp and 7.07E-4 reach validation unchanged)</text>

  <rect x="550" y="266" width="200" height="42" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="562" y="283" font-size="11" font-weight="600" fill="#78350f">Time doesn't exist → skip</text>
  <text x="562" y="298" font-size="10" fill="#92400e">DST start, 5 Oct: 02:00–02:45</text>

  <rect x="550" y="314" width="200" height="42" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="562" y="331" font-size="11" font-weight="600" fill="#78350f">Blank → skip</text>
  <text x="562" y="346" font-size="10" fill="#92400e">Gap detection reports it later</text>

  <rect x="550" y="362" width="200" height="42" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="562" y="379" font-size="11" font-weight="600" fill="#17253c">Repeated hour → first pass</text>
  <text x="562" y="394" font-size="10" fill="#475569">DST end, 5 Apr: fold=0 (AEDT)</text>

  <rect x="10" y="266" width="200" height="138" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="22" y="286" font-size="12" font-weight="600" fill="#17253c">On the real FY26 files</text>
  <text x="22" y="304" font-size="10" fill="#475569">6 files, 2,182 days</text>
  <text x="22" y="319" font-size="10" fill="#475569">208,230 values submitted</text>
  <text x="22" y="334" font-size="10" fill="#475569">1,218 blanks skipped</text>
  <text x="22" y="349" font-size="10" fill="#475569">24 DST labels skipped (4 a file)</text>
  <text x="22" y="364" font-size="10" fill="#475569">0 intervals submitted twice</text>
  <text x="22" y="379" font-size="10" fill="#475569">Totals match all 209,472 values</text>
  <text x="22" y="394" font-size="10" fill="#475569">About 0.1 s to parse a file</text>

  <!-- ingest_readings -->
  <rect x="230" y="420" width="300" height="126" rx="9" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="244" y="440" font-size="12" font-weight="600" fill="#17253c"><tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">ingest_readings()</tspan> (existing)</text>
  <text x="244" y="458" font-size="10" fill="#475569">Batches of 5,000, each in its own transaction:</text>
  <text x="244" y="473" font-size="10" fill="#475569">1  validate_reading(): number, unit, sign, alignment</text>
  <text x="244" y="488" font-size="10" fill="#475569">2  INSERT … ON CONFLICT DO NOTHING</text>
  <text x="244" y="503" font-size="10" fill="#475569">3  compare with stored values: duplicate or conflict</text>
  <text x="244" y="518" font-size="10" fill="#475569">4  bulk-create RawReadings and Discrepancies</text>
  <text x="244" y="535" font-size="10" fill="#475569" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">source = "ausgrid-csv:&lt;file name&gt;"</text>

  <rect x="550" y="420" width="200" height="126" rx="9" fill="#dcfce7" stroke="#86efac"/>
  <text x="562" y="440" font-size="12" font-weight="600" fill="#14532d">Database</text>
  <text x="562" y="458" font-size="10" fill="#166534">MeterReading: first valid value</text>
  <text x="562" y="473" font-size="10" fill="#166534">per meter and interval, in kWh</text>
  <text x="562" y="491" font-size="10" fill="#166534">RawReading: every value sent,</text>
  <text x="562" y="506" font-size="10" fill="#166534">with its status and source</text>
  <text x="562" y="524" font-size="10" fill="#166534">Discrepancy: rejected values</text>
  <text x="562" y="539" font-size="10" fill="#166534">and conflicting duplicates</text>

  <rect x="10" y="420" width="200" height="126" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="22" y="440" font-size="12" font-weight="600" fill="#17253c">Running a file again</text>
  <text x="22" y="458" font-size="10" fill="#475569">Stored values come back as</text>
  <text x="22" y="473" font-size="10" fill="#475569">duplicates: no new readings</text>
  <text x="22" y="488" font-size="10" fill="#475569">and no new discrepancies.</text>
  <text x="22" y="506" font-size="10" fill="#475569">If a batch fails, earlier batches</text>
  <text x="22" y="521" font-size="10" fill="#475569">stay committed; re-running</text>
  <text x="22" y="536" font-size="10" fill="#475569">the file completes it.</text>

  <!-- Summary -->
  <rect x="230" y="562" width="300" height="62" rx="9" fill="#eef2f7" stroke="#cbd5e1"/>
  <text x="244" y="582" font-size="12" font-weight="600" fill="#17253c">Summary line per file</text>
  <text x="244" y="598" font-size="10" fill="#475569">days · accepted · duplicate (conflicting) · rejected</text>
  <text x="244" y="613" font-size="10" fill="#475569">blanks skipped · DST skipped · seconds taken</text>

  <rect x="550" y="562" width="200" height="62" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="562" y="582" font-size="12" font-weight="600" fill="#17253c" font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--dry-run</text>
  <text x="562" y="598" font-size="10" fill="#475569">Runs both passes and the</text>
  <text x="562" y="613" font-size="10" fill="#475569">adapter, but stores nothing</text>

  <!-- Legend -->
  <g font-size="10">
    <rect x="10" y="644" width="12" height="12" rx="3" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="28" y="654">existing code</text>
    <rect x="120" y="644" width="12" height="12" rx="3" fill="#fef3c7" stroke="#fcd34d"/>
    <text x="138" y="654">skipped, counted</text>
    <rect x="246" y="644" width="12" height="12" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="264" y="654">stops the import</text>
    <rect x="372" y="644" width="12" height="12" rx="3" fill="#dcfce7" stroke="#86efac"/>
    <text x="390" y="654">tables written</text>
    <rect x="484" y="644" width="12" height="12" rx="3" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 2"/>
    <text x="502" y="654">note</text>
  </g>
</svg>
